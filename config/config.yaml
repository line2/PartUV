verbose: false
save_stuff: false

num_cuda_streams: 10

pipeline:
  threshold: 1.25
  parallelDepth: 10

  component_maxDepth: 10
  checkSelfIntersection: false
  checkNon2Manifold: true
  num_omp_threads: 8
  num_cuda_streams: 10
  
unwrap:
  method: "abf" # "abf" | "lscm" | "igl_lscm" | "igl_harmonic1" | "igl_harmonic2" | "igl_arap" | "igl_slim"
  abf_iters: 5
  agg_parts: 10
  pamo: true
  pamo_backend: "cluster"   # "cluster" (default) | "idt"* | "iso"* | "identity"* | "" (CUDA PAMO)
                            #   * experimental; idt measured neutral, iso does not finish
                            #     on 500k-face charts. See docs/UV_QUALITY.md section 3.
  pamo_proxy_smooth: 0
  pamo_proxy_ratio: 0.05
  pamo_proxy_max_faces: 4000
  pamo_proxy_repr: "quadric"
  usePamoFaceThreshold: 4000   # measured: below this the PAMO proxy does not change the result